<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MILE</title>

<style>

:root {

  color-scheme: light;

  --bg: #f5f5f5;

  --card: #ffffff;

  --text: #171717;

  --muted: #777;

  --line: #e5e5e5;

}

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 22px 14px 30px;

  background: var(--bg);

  color: var(--text);

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

main { max-width: 560px; margin: auto; }

header { padding: 12px 4px 24px; }

h1 {

  margin: 0;

  font-size: 35px;

  letter-spacing: 5px;

  font-weight: 800;

}

.subtitle { color: var(--muted); font-size: 13px; margin-top: 6px; }

.card {

  background: var(--card);

  border: 1px solid var(--line);

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 14px;

}

h2 {

  margin: 0 0 16px;

  font-size: 16px;

}

label {

  display: block;

  font-size: 13px;

  color: #555;

  margin: 13px 0 7px;

}

input, select {

  width: 100%;

  min-height: 46px;

  padding: 11px 12px;

  border: 1px solid #ddd;

  border-radius: 10px;

  background: white;

  color: #111;

  font-size: 16px;

  outline: none;

}

input:focus, select:focus { border-color: #555; }

.segment {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

button {

  min-height: 46px;

  padding: 12px;

  border: 1px solid #171717;

  border-radius: 11px;

  background: white;

  color: #171717;

  font-size: 14px;

  font-weight: 650;

  cursor: pointer;

}

button.active, .primary {

  background: #171717;

  color: white;

}

.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.hidden { display: none !important; }

.result {

  background: #171717;

  color: white;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 14px;

}

.result-label { color: #c5c5c5; font-size: 13px; }

.total {

  font-size: clamp(36px, 10vw, 48px);

  font-weight: 750;

  letter-spacing: -1.5px;

  margin: 5px 0 15px;

  overflow-wrap: anywhere;

}

.result-row {

  display: flex;

  justify-content: space-between;

  gap: 12px;

  padding: 10px 0;

  border-top: 1px solid #414141;

  font-size: 14px;

}

.result-row strong { text-align: right; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.actions button { width: 100%; }

.note { color: var(--muted); font-size: 12px; line-height: 1.5; }

footer {

  text-align: center;

  color: #777;

  font-size: 12px;

  padding: 12px 4px;

}

</style>

</head>

<body>

<main>

  <header>

    <h1>MILE</h1>

    <div class="subtitle">Калькулятор расхода топлива</div>

  </header>

  <section class="card">

    <h2>01 / Исходные данные</h2>

    <label for="norm">Норма расхода, л / 100 км</label>

    <input id="norm" type="number" min="0" step="0.001" value="9.8">

    <label>Режим расчёта</label>

    <div class="segment">

      <button id="oneBtn" class="active" type="button">Одна часть</button>

      <button id="twoBtn" type="button">Две части</button>

    </div>

  </section>

  <section class="card">

    <h2>02 / Пробег и надбавки</h2>

    <div id="part1">

      <label for="km1">Пробег, км</label>

      <input id="km1" type="number" min="0" step="0.1" value="500">

      <label for="allow1">Надбавка</label>

      <select id="allow1">

        <option value="0">0% — без надбавок</option>

        <option value="15">15% — город</option>

        <option value="6">6% — климат</option>

        <option value="21" selected>15% + 6% — город и климат</option>

        <option value="custom">Своя надбавка</option>

      </select>

      <div id="customBox1" class="hidden">

        <label for="custom1">Своя надбавка, %</label>

        <input id="custom1" type="number" min="0" step="0.1" value="0">

      </div>

    </div>

    <div id="part2" class="hidden">

      <div style="border-top:1px solid #eee;margin:18px 0"></div>

      <h2>Часть 2</h2>

      <label for="km2">Пробег, км</label>

      <input id="km2" type="number" min="0" step="0.1" value="400
        let text = `MILE — расчёт расхода топлива\n`;

    text += `Норма: ${fmt(norm, 3)} л/100 км\n`;

    text += `Часть 1: ${fmt(km1)} км × ${fmt(norm, 3)} / 100`;

    text += ` × (1 + ${fmt(p1)} / 100) = ${fmt(f1)} л\n`;

    if (twoParts) {

      text += `Часть 2: ${fmt(km2)} км × ${fmt(norm, 3)} / 100`;

      text += ` × (1 + ${fmt(p2)} / 100) = ${fmt(f2)} л\n`;

    }

    text += `Общий пробег: ${fmt(km1 + km2)} км\n`;

    text += `ИТОГО: ${fmt(f1 + f2)} л`;

    try {

      await navigator.clipboard.writeText(text);

      $('status').textContent = 'Расчёт скопирован.';

    } catch {

      const area = document.createElement('textarea');

      area.value = text;

      document.body.appendChild(area);

      area.select();

      const ok = document.execCommand('copy');

      area.remove();

      $('status').textContent = ok

        ? 'Расчёт скопирован.'

        : 'Не удалось скопировать. Выделите результат вручную.';

    }

  });

  setMode(false);

})();

</script>

</body>

</html>">
